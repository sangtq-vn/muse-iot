# ESPHome base template for Muse-IoT
# Rename to your_box.yaml and fill in WiFi credentials + MQTT broker.
# Flash with: esphome run your_box.yaml

substitutions:
  device_name: muse-iot-box
  topic_prefix: muse-iot   # must match config.yaml device.config.topic_prefix

esphome:
  name: ${device_name}
  friendly_name: Muse-IoT Box

esp32:
  board: esp32dev
  framework:
    type: arduino

# ── Connectivity ──────────────────────────────────────────────────────────

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Muse-IoT Fallback"
    password: "muse-iot123"

mqtt:
  broker: !secret mqtt_broker       # e.g. 192.168.1.100
  port: 1883
  username: !secret mqtt_username   # optional
  password: !secret mqtt_password   # optional
  topic_prefix: ${topic_prefix}

# ── Sensors ───────────────────────────────────────────────────────────────

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# SHT31 — temperature + humidity
sensor:
  - platform: sht3xd
    address: 0x44
    temperature:
      name: "Air Temperature"
      id: sht31_temp
      on_value:
        then:
          - mqtt.publish:
              topic: "${topic_prefix}/sensors/sht31_temp"
              payload: !lambda 'return to_string(x);'
    humidity:
      name: "Air Humidity"
      id: sht31_humidity
      on_value:
        then:
          - mqtt.publish:
              topic: "${topic_prefix}/sensors/sht31_humidity"
              payload: !lambda 'return to_string(x);'
    update_interval: 30s

  # BH1750 — light level
  - platform: bh1750
    name: "Light Level"
    id: bh1750_lux
    address: 0x23
    on_value:
      then:
        - mqtt.publish:
            topic: "${topic_prefix}/sensors/bh1750_lux"
            payload: !lambda 'return to_string(x);'
    update_interval: 30s

  # Capacitive soil moisture (ADC)
  - platform: adc
    pin: GPIO34
    name: "Soil Moisture"
    id: soil_cap
    attenuation: 11db
    filters:
      # Calibrate: dry=3.3V (0%) wet=1.2V (100%)
      - calibrate_linear:
          - 3.3 -> 0
          - 1.2 -> 100
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      then:
        - mqtt.publish:
            topic: "${topic_prefix}/sensors/soil_cap"
            payload: !lambda 'return to_string(x);'
    update_interval: 30s

# ── Actuators ─────────────────────────────────────────────────────────────

# Water pump relay — GPIO 26
switch:
  - platform: gpio
    pin: GPIO26
    name: "Water Pump"
    id: relay_pump
    restore_mode: ALWAYS_OFF

  # Cooling fan relay — GPIO 27
  - platform: gpio
    pin: GPIO27
    name: "Cooling Fan"
    id: relay_fan
    restore_mode: ALWAYS_OFF

# Grow light — PWM dimming on GPIO 25
output:
  - platform: ledc
    pin: GPIO25
    id: pwm_light_output
    frequency: 1000Hz

light:
  - platform: monochromatic
    name: "Grow Light"
    id: pwm_light
    output: pwm_light_output
    restore_mode: ALWAYS_OFF

# ── MQTT command subscriptions ────────────────────────────────────────────

mqtt:
  on_message:
    - topic: "${topic_prefix}/actuator/relay_pump/set"
      then:
        - lambda: |-
            auto doc = parse_json(x);
            if (doc["value"] == "on") {
              id(relay_pump).turn_on();
            } else {
              id(relay_pump).turn_off();
            }

    - topic: "${topic_prefix}/actuator/relay_fan/set"
      then:
        - lambda: |-
            auto doc = parse_json(x);
            if (doc["value"] == "on") {
              id(relay_fan).turn_on();
            } else {
              id(relay_fan).turn_off();
            }

    - topic: "${topic_prefix}/actuator/pwm_light/set"
      then:
        - lambda: |-
            auto doc = parse_json(x);
            float pct = doc["value"].as<float>() / 100.0;
            auto call = id(pwm_light).make_call();
            call.set_brightness(pct);
            call.perform();

# ── Status ────────────────────────────────────────────────────────────────

binary_sensor:
  - platform: status
    name: "ESP32 Online"

api:
  encryption:
    key: !secret api_key
