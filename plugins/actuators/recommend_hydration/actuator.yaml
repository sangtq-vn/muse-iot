id: recommend_hydration
name: Hydration Reminder
version: 1.0.0
author: muse-iot-core
description: >
  Daily flag: the user should increase water intake today.
  Triggered on elevated heart rate, low SpO2 trend, or hot weather context.

commands:
  - key: recommend_hydration
    name: Drink more water today
    type: on_off
    mqtt: actuator/recommend_hydration/set
    values: ["on", "off"]

hardware:
  signal: notification

compatible_devices:
  - esp32_mqtt
