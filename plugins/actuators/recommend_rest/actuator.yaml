id: recommend_rest
name: Rest & Sleep Recommendation
version: 1.0.0
author: muse-iot-core
description: >
  Daily flag: the user should prioritise rest or sleep today.
  Used when readings suggest fatigue, high resting HR, or elevated BP from stress.

commands:
  - key: recommend_rest
    name: Rest today
    type: on_off
    mqtt: actuator/recommend_rest/set
    values: ["on", "off"]

hardware:
  signal: notification

compatible_devices:
  - esp32_mqtt
