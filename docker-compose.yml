services:

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./docker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping 2>/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  muse-iot:
    build: .
    restart: unless-stopped
    depends_on:
      mqtt:
        condition: service_healthy
    environment:
      # Muse API key (Meta Model API). Either paste it directly into
      # config.yaml under llm.api_key, or export META_API_KEY here.
      - META_API_KEY=${META_API_KEY}
    volumes:
      # Mount your config — update broker_host to "mqtt" (the service name above).
      - ./config.yaml:/app/config.yaml:ro
      # Persist sensor history and logs on the host.
      - muse-iot_data:/root/.muse-iot

  muse-iot-ui:
    build: .
    restart: unless-stopped
    command: ["ui"]
    ports:
      - "7070:7070"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - muse-iot_data:/root/.muse-iot
    depends_on:
      mqtt:
        condition: service_healthy

volumes:
  mqtt_data:
  muse-iot_data:
